{% if p.review_pending %}
<span class="registration-review-actions" data-registration-name="{{ p.full_name }}" data-registration-number="{{ p.pre_registration_number }}" data-registration-birthdate="{{ p.birthdate|date:'F j, Y' }}" data-registration-sex="{{ p.get_sex_display }}" data-registration-barangay="{{ p.barangay }}" data-registration-contact="{{ p.contact_number }}" data-registration-bite="{{ p.bite_datetime|date:'F j, Y g:i A' }}" data-registration-incident="{{ p.incident_place }}" data-registration-detail="{{ p.view_url }}">
    <button type="button" class="registration-review-button review-approve" data-review-kind="approve" data-review-action="{% url 'pre_registrations:convert' p.pk %}"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>Approve</button>
    <button type="button" class="registration-review-button review-reject" data-review-kind="reject" data-review-action="{% url 'pre_registrations:staff_reject' p.pk %}"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>Reject</button>
</span>
{% else %}
<a href="{{ p.view_url }}" class="btn-view"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>View</a>
{% endif %}
